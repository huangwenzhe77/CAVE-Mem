[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cave-mem-v2"
version = "0.2.0"
description = "Action-conditioned, risk-constrained failure-memory intervention research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = ["numpy>=1.26,<3"]
encoder = ["sentence-transformers>=3,<6"]
alfworld = ["alfworld==0.4.2", "PyYAML>=6,<7"]
dev = ["pytest>=8,<10"]

[project.scripts]
cave2 = "cave_mem_v2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

